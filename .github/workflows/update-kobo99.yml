name: Update Kobo 99 Calendar

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_year:
        description: "Optional full year scan, for example 2026"
        required: false
        type: string
      history_start_year:
        description: "Optional historical backfill start year, for example 2024"
        required: false
        type: string
      history_end_year:
        description: "Optional historical backfill end year. Defaults to current year."
        required: false
        type: string
  schedule:
    # Taipei is UTC+8. Two attempts each hour, Thursday 08:17 through Wednesday 23:47.
    # Minutes 17 and 47 avoid the top of the hour, when GitHub most often delays or drops schedules.
    # 08:17–23:47 Taipei every day is 00:17–15:47 UTC.
    - cron: "17 0-15 * * *"
    - cron: "47 0-15 * * *"
    # 00:17–07:47 Taipei on Friday–Wednesday is 16:17–23:47 UTC on Thursday–Tuesday.
    # Wednesday 16:00–23:00 UTC is Thursday 00:00–07:00 Taipei, which stays outside the window.
    - cron: "17 16-23 * * 0-2,4-6"
    - cron: "47 16-23 * * 0-2,4-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether this hour should scrape
        id: gate
        if: github.event_name == 'schedule'
        run: |
          result="$(python scripts/kobo99.py --out public --should-scrape)"
          echo "scrape=${result}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: |
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Build calendar files
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: |
          if [ -n "${{ inputs.history_start_year }}" ]; then
            if [ -n "${{ inputs.history_end_year }}" ]; then
              python scripts/kobo99.py --out public --history-start-year "${{ inputs.history_start_year }}" --history-end-year "${{ inputs.history_end_year }}"
            else
              python scripts/kobo99.py --out public --history-start-year "${{ inputs.history_start_year }}"
            fi
          elif [ -n "${{ inputs.full_year }}" ]; then
            python scripts/kobo99.py --out public --full-year "${{ inputs.full_year }}"
          else
            python scripts/kobo99.py --out public
          fi

      - name: Commit generated files
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git diff --quiet -- public/events.json public/kobo99.ics index.html; then
            git checkout -B main origin/main
          else
            git stash push -m "kobo99-generated" -- public/events.json public/kobo99.ics index.html
            git checkout -B main origin/main
            git stash pop
          fi
          git add public/events.json public/kobo99.ics index.html
          git diff --cached --quiet || git commit -m "Update Kobo 99 calendar"
          git push origin main || (git pull --rebase --autostash origin main && git push origin main)

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        with:
          path: .

      - id: deployment
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        uses: actions/deploy-pages@v4
